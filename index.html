    /* Vessel Light UI (docs/art/DECISIONS.md §10.2). Every colour is a palette token written by

    :root { --u: clamp(2px, calc(100vh / 384), 5px); }
    * { box-sizing: border-box; }

    .hearts-box { position: relative; display: flex; }
    #hearts, .hearts-strip { display: flex; gap: var(--u); }
    /* spirit (sky only): a 1 u light.core outline round the hearts on a 1 u ink.void keyline, drawn clockwise from the

    .spirit-ring { position: absolute; left: calc(-3 * var(--u)); top: calc(-3 * var(--u)); width: calc(100% + 6 * var(--u));

    body.dev-touch #overlay { padding: calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
    body.dev-touch #overlay .card { width: min(920px, 100%); }
    body.dev-touch #overlay .cover img { max-height: 34vh; }
    body.dev-touch #overlay .tagline { margin: 6px 12px 8px; font-size: 14px; }
    body.dev-touch #overlay .menu { grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 10px 20px; }
    body.dev-touch #overlay .actions button { padding: 10px 14px; }
    body.dev-touch #overlay #graphics button { width: 40px; height: 40px; padding: 0; }
    body.dev-touch #graphics input { height: 40px; }
    body.dev-touch #graphics input::-webkit-slider-thumb { width: 18px; height: 28px; margin-top: -11px; }
    body.dev-touch #graphics input::-moz-range-thumb { width: 18px; height: 28px; }
    body.dev-touch #overlay table { font-size: 14px; }
    body.dev-touch #controls tbody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
    body.dev-touch #controls tr { display: flex; flex-direction: column; padding: 3px 0; }
    body.dev-touch #controls td { padding: 0; }
    body.dev-touch #inventory .card { width: 96vw; max-height: 94vh; padding: calc(4 * var(--u)) calc(5 * var(--u)); }
    body.dev-touch #inventory .cols { grid-template-columns: 1fr 220px; }
    body.dev-touch #inventory header .close { width: 44px; height: 44px; }
    @media (max-width: 480px) {
      #banner[data-offer="true"] { width: calc(100vw - 24px); max-width: calc(100vw - 24px); }
      #banner .offer-actions { flex-direction: column; }
      #banner .offer-actions button { width: 100%; }
    }
    @media (hover: none) and (pointer: coarse) {
      #banner[data-offer="true"] { width: min(440px, calc(100vw - 24px)); max-width: calc(100vw - 24px); }
      body.dev-touch #banner[data-offer="true"] { max-width: calc(100vw - 24px); }
      #banner .offer-actions { flex-direction: column; }

<body>
  <!-- Crawlers that do not run scripts read this. Players with scripts off see it too. The game itself is a canvas. -->
  <noscript>
    <main>
      <h1>THE ROOTS</h1>
      <p>A first-person voxel roguelite about going deeper, free to play in your browser with no install. Break the blocks that hold you, shoot intentions with a polarity, meet the projections of your patterns in the depths, and collect practices that change how you play, every run.</p>
      <p>Think of it as Minecraft and The Binding of Isaac had a child, with a cavern world as deep and dark as Noita. Open source: <a href="https://github.com/yeagob/sotano">github.com/yeagob/sotano</a>. Enable JavaScript to play.</p>
    </main>
  </noscript>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="star"></div>
  <div id="berserk"></div>
  <div id="status">
    <div id="hearts-row" class="hearts-row">
      <div id="hearts-box" class="hearts-box"><div id="hearts"></div></div>
      <div id="spirit-num" class="spirit-num" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div>
    </div>
    <div id="breath"></div>
    <div class="counter"><span class="ico bomb"></span><span id="bombs">01</span></div>
    <div class="counter"><span class="ico key"></span><span id="keys">00</span></div>
    <div id="polarity" data-polarity="positive"></div>
    <div id="items"></div>
  </div>
  <div id="hand"></div>
  <div id="corner"><canvas id="minimap" class="slate"></canvas><div id="depth"></div></div>
  <div id="debug"></div>
  <div id="banner"></div>
  <div id="toast" class="slate"></div>
  <div id="boss" hidden><span id="bossname"></span><div><i id="bossfill"></i></div></div>
  <div id="toll"></div>
  <div id="death"></div>
  <div id="fade"><i></i></div>
  <div id="overlay">
    <div class="card slate">
      <nav class="tabs">
        <button type="button" data-act="tab-menu" data-tab="menu" aria-selected="true"></button>
        <button type="button" data-act="tab-items" data-tab="items" aria-selected="false"></button>
      </nav>
      <div class="panel-menu">
      <h1 class="cover"><img src="/the-roots-cover.jpg" alt="THE ROOTS" width="1663" height="640" /></h1>
      <p class="tagline" data-i18n="intro.tagline">Go down into yourself. Break what holds you. Find the way back up.</p>
      <div class="menu">
        <div class="actions">
          <button type="button" class="go" id="play" data-act="resume" data-i18n="intro.play">Click to play</button>
          <button type="button" id="newrun" data-act="restart" data-i18n="pause.newRun">New run</button>
          <div id="lang"></div>
          <section id="graphics">
            <h2 data-i18n="graphics.title">Graphics</h2>
            <div class="row"><label for="fov" data-i18n="graphics.fov">Field of view</label><output id="fov-value" for="fov">75°</output></div>
            <div class="row">
              <button type="button" data-act="fov-down" aria-label="Narrower field of view">−</button>
              <input type="range" id="fov" min="70" max="100" step="5" value="75" />
              <button type="button" data-act="fov-up" aria-label="Wider field of view">+</button>
            </div>
            <p id="fov-hint" class="hint"></p>
          </section>
          <p id="seed" class="seed"></p>
        </div>
        <section>
          <h2 data-i18n="intro.controls">Controls</h2>
          <table id="controls"></table>
        </section>
      </div>
      <footer class="credits">
        <p><span data-i18n="intro.openSource">This game is open source and open to collaboration: if you love video games and want to help, you are welcome here.</span> <a href="https://github.com/yeagob/sotano" target="_blank" rel="noopener" data-i18n="intro.repo">Repository</a></p>
        <span id="version"></span>
        <a class="bug" href="https://github.com/yeagob/sotano/issues/new?template=bug_report.md" target="_blank" rel="noopener" title="Report a bug" aria-label="Report a bug"></a>
        <a class="coffee" href="https://buymeacoffee.com/yeagob" target="_blank" rel="noopener" title="Buy me a coffee" aria-label="Buy me a coffee"></a>
      </footer>
      </div>
      <div id="inventory"></div>
    </div>
  </div>
  <div id="rotate" data-i18n="touch.rotate">Turn your device sideways to play</div>
  <div id="loading" data-i18n="app.loading">Loading…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
