<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>THE ROOTS</title>
  <style>
    /* Vessel Light UI (docs/art/DECISIONS.md §10.2). Every colour is a palette token written by
       applyPaletteCss() (src/render/icons.ts) as a CSS variable: no hex in this file. */
    :root { --u: clamp(2px, calc(100vh / 384), 5px); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--pal-ink-void); overflow: hidden; color: var(--ui-text);
      font: 15px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    img { image-rendering: pixelated; }
    /* the cellar slate: ink panel, ink outline, inner bevel, chamfered corners, no radius, no blur */
    .slate { background: color-mix(in srgb, var(--ui-panel) 95%, transparent); outline: 1px solid var(--ui-line);
      box-shadow: inset 2px 2px 0 var(--ui-bevel-hi), inset -2px -2px 0 var(--ui-line);
      clip-path: polygon(calc(2 * var(--u)) 0, calc(100% - 2 * var(--u)) 0, 100% calc(2 * var(--u)), 100% calc(100% - 2 * var(--u)),
        calc(100% - 2 * var(--u)) 100%, calc(2 * var(--u)) 100%, 0 calc(100% - 2 * var(--u)), 0 calc(2 * var(--u))); }

    /* crosshair: shape, not colour */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--ui-text); box-shadow: 0 0 0 1px var(--ui-line); }
    #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }

    /* Isaac corner: hearts, breakthroughs (seeds), keys, practices */
    #status { position: fixed; top: 10px; left: 12px; pointer-events: none; }
    #hearts { display: flex; gap: var(--u); margin-bottom: 6px; }
    .heart { position: relative; width: calc(11 * var(--u)); height: calc(10 * var(--u)); display: inline-block;
      background: no-repeat center/contain var(--ico-heartEmpty); image-rendering: pixelated; }
    .heart.full { background-image: var(--ico-heart); }
    .heart > .heart { position: absolute; left: 0; top: 0; }
    /* invulnerable: steady at 55 % with a paper outline (the 5.5 Hz blink is gone) */
    #hearts.safe > .heart { opacity: .55; outline: 1px solid var(--ui-text); }
    /* low health: the last heart beats at 1.1 Hz */
    #hearts.low > .heart:last-child { animation: beat .9s ease-in-out infinite; }
    @keyframes beat { 50% { transform: scale(1.12); } }
    /* breath under water: bubbles that pop one by one; the last one pulses when it is almost gone */
    #breath { display: none; gap: calc(var(--u) / 2); margin-bottom: 6px; }
    #breath.on { display: flex; }
    .bubble { width: calc(8 * var(--u)); height: calc(8 * var(--u)); background: no-repeat center/contain var(--ico-bubble); image-rendering: pixelated; }
    .bubble.empty { background-image: var(--ico-bubbleEmpty); opacity: .6; }
    #breath.low > .bubble.last { animation: beat .7s ease-in-out infinite; }
    .counter { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: bold; margin: 2px 0;
      font-variant-numeric: tabular-nums; text-shadow: 1px 0 var(--ui-line), -1px 0 var(--ui-line), 0 1px var(--ui-line), 0 -1px var(--ui-line); }
    .counter .ico { width: 20px; height: 20px; background: no-repeat center/contain; image-rendering: pixelated; }
    .ico.bomb { background-image: var(--ico-seed); }
    .ico.key { background-image: var(--ico-key); }
    /* the loaded intention (F): a round mark, the same size and place in both states; static, never flickers.
       Positive: a filled gold disc. Negative: an ember ring round an ink centre (shape first, value confirms).
       The 1 px ink outline keeps it readable over any floor or the sky, like the counters' text outline. */
    #polarity { width: 14px; height: 14px; margin: 4px 0 2px 3px; border-radius: 50%; border: 2px solid var(--pol); background: var(--pol);
      box-shadow: 0 0 0 1px var(--ui-line); }
    #polarity[data-polarity="negative"] { background: var(--ui-line); }
    #items { display: flex; flex-wrap: wrap; gap: 3px; max-width: 220px; margin-top: 8px; }
    #items img { width: 28px; height: 28px; }

    /* hand slots */
    #hand { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; }
    .slot { position: relative; width: calc(24 * var(--u)); height: calc(24 * var(--u)); padding: 4px; }
    .slot.top { box-shadow: inset 0 0 0 2px var(--ui-text); }
    .slot img { width: 100%; height: 100%; display: block; }

    /* minimap top-right (the right hand used to cover it), floor label underneath */
    #corner { position: fixed; right: 12px; top: 10px; text-align: right; pointer-events: none; }
    #minimap { display: block; margin: 0 0 4px auto; width: 180px; padding: 4px; }
    #depth { font-size: 15px; color: var(--ui-text-2); }
    #debug { position: fixed; right: 10px; bottom: 8px; text-align: right; white-space: pre; font: 12px/1.3 ui-monospace, Consolas, monospace; opacity: .8; pointer-events: none; display: none; }

    /* practice banner: slate, top 12 %, click to dismiss */
    #banner { position: fixed; left: 50%; top: 12%; transform: translate(-50%, -14px); pointer-events: none; opacity: 0; max-width: min(640px, 92vw); }
    #banner.show { animation: bannerIn .5s ease forwards; }
    @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -14px) scale(.96); } 60% { opacity: 1; transform: translate(-50%, 0) scale(1.03); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { #banner.show { animation: none; opacity: 1; transform: translate(-50%, 0); } }
    #banner .dismiss { margin: 8px 0 0; font-size: 14px; color: var(--ui-faded); text-align: right; }
    #banner .ribbon { display: flex; gap: 14px; align-items: flex-start; padding: calc(6 * var(--u)); border-left: calc(2 * var(--u)) solid var(--c); }
    #banner .ribbon img { width: 70px; height: 70px; flex: none; filter: drop-shadow(0 0 8px var(--c)); }
    #banner b { display: block; font-size: 28px; letter-spacing: 1px; }
    #banner span { display: block; margin-top: 2px; font-size: 16px; font-style: italic; color: var(--ui-text-2); }
    #banner small { display: block; margin-top: 3px; font-size: 14px; color: var(--ui-faded); }
    .effect { margin: 6px 0 2px; padding: 4px 8px; background: var(--ui-line); border-left: 3px solid var(--c, var(--ui-text-2)); font-size: 15px; color: var(--ui-text); }
    #banner i { display: block; font-style: normal; font-size: 15px; margin-top: 3px; }
    #banner i.up { color: var(--ui-up); } #banner i.down { color: var(--ui-down); } #banner i.syn { color: var(--ui-gold); }
    .q { font-style: normal; letter-spacing: 1px; font-size: 15px; color: var(--ui-gold); }
    .q4 { text-shadow: 0 0 6px var(--ui-gold); }

    /* screen effects, gentle (§10.4): item flash peak .45 over .5 s; hurt vignette life.dark peak .35 over .4 s */
    #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 45%, var(--c) 0%, transparent 70%); }
    #flash.on { animation: flash .5s ease-out; }
    @keyframes flash { 0% { opacity: .45; } 100% { opacity: 0; } }
    #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 160px 40px var(--pal-life-dark); }
    #hurt.on { animation: hurt .4s ease-out; }
    @keyframes hurt { 0% { opacity: .35; } 100% { opacity: 0; } }

    /* toasts: slate, 16 px, top-centre at 22 % (away from the hand slots) */
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: calc(3 * var(--u)) calc(6 * var(--u));
      font-size: 16px; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }

    /* panels */
    #overlay { position: fixed; inset: 0; display: flex; padding: 16px; overflow-y: auto; background: color-mix(in srgb, var(--pal-ink-void) 55%, transparent); cursor: pointer; }
    #overlay .card { margin: auto; width: min(960px, 100%); padding: calc(2 * var(--u)) calc(2 * var(--u)) calc(5 * var(--u)); }
    #overlay .cover { margin: 0; line-height: 0; }
    #overlay .cover img { display: block; width: 100%; height: auto; aspect-ratio: 1663 / 640; max-height: 30vh; object-fit: cover; object-position: 50% 35%; image-rendering: auto; }
    #overlay .tagline { margin: 10px 16px 12px; text-align: center; color: var(--ui-text-2); }
    #overlay .menu { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 14px 28px; align-items: start; padding: 0 calc(6 * var(--u)); }
    #overlay .actions { display: flex; flex-direction: column; gap: 8px; }
    #overlay .actions button { font: inherit; font-weight: bold; color: var(--ui-text); background: var(--ui-line); border: 0; margin: 0; padding: 8px 14px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ui-bevel-hi); }
    #overlay #play { color: var(--ui-gold); box-shadow: inset 0 0 0 2px var(--ui-gold); }
    #overlay .actions button:hover, #overlay .actions button:focus-visible { color: var(--ui-gold); box-shadow: inset 0 0 0 2px var(--ui-gold), inset 0 0 0 3px var(--ui-text); outline: none; }
    #overlay h2 { margin: 0 0 4px; font-size: 14px; letter-spacing: 2px; color: var(--ui-text-2); text-transform: uppercase; }
    #overlay table { border-collapse: collapse; }
    #overlay td { padding: 2px 10px 2px 0; vertical-align: top; }
    #overlay td:first-child { color: var(--ui-gold); white-space: nowrap; }
    #lang { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 0; font-size: 14px; }
    #lang span { color: var(--ui-faded); margin-right: 2px; }
    #lang button { font: inherit; font-weight: normal; color: var(--ui-text); background: var(--ui-line); border: 0; box-shadow: inset 0 0 0 1px var(--ui-bevel-hi); padding: 2px 10px; cursor: pointer; }
    #lang button:hover, #lang button.on { color: var(--ui-gold); box-shadow: inset 0 0 0 2px var(--ui-gold); }
    #overlay .actions .seed { margin: 2px 0 0; text-align: left; }
    .go { margin-top: 12px; text-align: center; font-weight: bold; color: var(--ui-gold); }
    #overlay .credits { display: flex; align-items: center; gap: 10px 14px; margin: 16px calc(6 * var(--u)) 0; padding-top: 10px; border-top: 2px solid var(--ui-line); font-size: 14px; color: var(--ui-faded); }
    #overlay .credits p { flex: 1; margin: 0; }
    #overlay .credits a { color: var(--ui-text-2); }
    #overlay .credits a:hover, #overlay .credits a:focus-visible { color: var(--ui-gold); }
    #version { flex: none; font-size: 14px; color: var(--ui-faded); font-variant-numeric: tabular-nums; }
    #overlay .credits .coffee { flex: none; display: block; width: 28px; height: 28px; background: var(--ico-coffee) center / 24px 24px no-repeat var(--ui-line);
      box-shadow: inset 0 0 0 1px var(--ui-bevel-hi); image-rendering: pixelated; }
    #overlay .credits .coffee:hover, #overlay .credits .coffee:focus-visible { box-shadow: inset 0 0 0 2px var(--ui-gold); outline: none; }
    @media (max-width: 640px) {
      #overlay .menu { grid-template-columns: minmax(0, 1fr); padding: 0 12px; }
      #overlay .credits { flex-wrap: wrap; margin: 16px 12px 0; }
      #overlay .credits p { flex-basis: 100%; }
      #overlay td:first-child { white-space: normal; width: 40%; }
    }

    #inventory { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--pal-ink-void) 70%, transparent); }
    #inventory.show { display: flex; }
    #inventory .card { width: min(960px, 94vw); max-height: 88vh; overflow: auto; padding: calc(6 * var(--u)) calc(8 * var(--u)); }
    #inventory header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ui-line); margin-bottom: 10px; }
    #inventory h2 { margin: 0 0 6px; letter-spacing: 3px; }
    #inventory h3 { margin: 14px 0 6px; font-size: 14px; letter-spacing: 2px; color: var(--ui-text-2); text-transform: uppercase; }
    #inventory .cols { display: grid; grid-template-columns: 1fr 260px; gap: 18px; }
    #inventory .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    /* 72 px tiles: the icon at an integer ×3 (42 px) and a name label under it (every item names itself, BESTIARY §8.7) */
    #inventory .tile { position: relative; width: 72px; padding: 6px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--ui-line); box-shadow: inset 0 0 0 1px var(--ui-bevel-hi); cursor: pointer; }
    #inventory .tile:focus-visible { outline: 2px solid var(--ui-text); }
    #inventory .tile.sel, #inventory .tile:hover { box-shadow: inset 0 0 0 2px var(--c), inset 0 0 0 3px var(--ui-text); }
    #inventory .tile img { width: 42px; height: 42px; }
    #inventory .tile .lbl { width: 64px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-align: center; overflow-wrap: normal; hyphens: auto; font-size: 14px; line-height: 1.3; color: var(--ui-text); }
    #inventory .tile i { position: absolute; right: 2px; top: 2px; font-style: normal; font-size: 14px; color: var(--ui-gold); }
    #inventory .detail { display: flex; gap: 14px; margin-top: 12px; padding: 10px; background: var(--ui-line); border-left: calc(2 * var(--u)) solid var(--c); }
    #inventory .detail img { width: 84px; height: 84px; flex: none; }
    #inventory .detail b { font-size: 20px; }
    #inventory .detail p { margin: 6px 0 4px; }
    #inventory .detail small { color: var(--ui-faded); font-size: 14px; }
    #inventory .fx { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
    #inventory .fx i { font-style: normal; color: var(--ui-up); font-size: 14px; }
    .path { font-style: normal; font-size: 14px; padding: 0 5px; border: 1px solid var(--p); color: var(--p); margin-left: 4px; }
    #inventory .syns { list-style: none; margin: 0; padding: 0; }
    #inventory .syns li { padding: 5px 8px; margin: 4px 0; background: var(--ui-line); }
    #inventory .syns li.on b { color: var(--ui-gold); } #inventory .syns li.off { opacity: .6; }
    #inventory .syns span { display: block; font-size: 14px; } #inventory .syns small { display: block; font-size: 14px; color: var(--ui-faded); }
    #inventory table { width: 100%; border-collapse: collapse; }
    #inventory td { padding: 2px 0; border-bottom: 1px solid var(--ui-line); color: var(--ui-text-2); } #inventory td:last-child { text-align: right; color: var(--ui-text); }
    .none { color: var(--ui-faded); }

    /* death is rest: night to ink, an ensō that almost closes, no blood red */
    #death { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: linear-gradient(var(--ui-night), var(--pal-ink-void)); }
    #death.show { display: flex; animation: fadeIn 1.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } }
    #death .card { padding: calc(8 * var(--u)) calc(10 * var(--u)); text-align: center; max-width: 520px; }
    #death .card::before { content: ""; display: block; width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%;
      border: calc(2 * var(--u)) solid var(--ui-text); border-right-color: transparent; transform: rotate(-20deg); }
    #death h1 { margin: 0 0 8px; letter-spacing: 3px; font-size: 40px; color: var(--ui-text); }
    #death .icons { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 12px 0; }
    #death .icons img { width: 42px; height: 42px; }

    /* R: the fade between runs, with a slow ensō (beginning again) */
    #fade { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; display: flex; align-items: center; justify-content: center;
      background: var(--fade-bg); transition: opacity var(--fade-t, .45s) ease-in-out; }
    #fade.on { opacity: 1; }
    #fade i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--fade-ink); border-top-color: transparent;
      transform: rotate(-30deg); opacity: .8; animation: enso 2.4s linear infinite; }
    @keyframes enso { to { transform: rotate(330deg); } }
    @media (prefers-reduced-motion: reduce) { #fade i { animation: none; } }
    .seed { font-size: 14px; color: var(--ui-faded); letter-spacing: 1px; text-align: center; cursor: copy; }
    .seed:hover { color: var(--ui-gold); }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--pal-ink-void); color: var(--pal-bone-paper); }
    #touch { position: fixed; inset: 0; display: none; touch-action: none; -webkit-touch-callout: none; }
    #touch.show { display: block; }
    #touch .stick { position: fixed; left: calc(18vw + env(safe-area-inset-left)); top: 72vh; width: 26vmin; height: 26vmin; margin: -13vmin 0 0 -13vmin;
      border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ui-text-2); background: color-mix(in srgb, var(--ui-panel) 35%, transparent); opacity: .35; pointer-events: none; }
    #touch .stick.on { opacity: .8; }
    #touch .stick i { position: absolute; left: 50%; top: 50%; width: 11vmin; height: 11vmin; margin: -5.5vmin 0 0 -5.5vmin; border-radius: 50%;
      background: var(--ui-text-2); box-shadow: 0 0 0 2px var(--ui-line); }
    .tb { position: fixed; width: 15vmin; height: 15vmin; padding: 0; border: 0; color: var(--ui-text); font: bold 14px/1 system-ui, sans-serif;
      background: var(--glyph) no-repeat center / 55% color-mix(in srgb, var(--ui-panel) 70%, transparent);
      box-shadow: inset 2px 2px 0 var(--ui-bevel-hi), inset -2px -2px 0 var(--ui-line), 0 0 0 1px var(--ui-line); image-rendering: pixelated;
      clip-path: polygon(8% 0, 92% 0, 100% 8%, 100% 92%, 92% 100%, 8% 100%, 0 92%, 0 8%); touch-action: none; }
    .tb.on { background-color: color-mix(in srgb, var(--ui-text) 25%, var(--ui-panel)); transform: scale(.94); }
    .tb.off { opacity: .4; }
    .tb span { position: absolute; right: 6%; bottom: 6%; text-shadow: 1px 0 var(--ui-line), -1px 0 var(--ui-line), 0 1px var(--ui-line), 0 -1px var(--ui-line); }
    .tb-cast { right: calc(5vw + env(safe-area-inset-right)); bottom: 8vh; width: 23vmin; height: 23vmin; box-shadow: inset 0 0 0 3px var(--pol, var(--ui-gold)), 0 0 0 1px var(--ui-line); }
    .tb-cast[data-polarity="negative"] { background-color: color-mix(in srgb, var(--ui-line) 85%, transparent); }
    .tb-jump { right: calc(5vw + 25vmin + env(safe-area-inset-right)); bottom: 6vh; }
    .tb-place { right: calc(5vw + 25vmin + env(safe-area-inset-right)); bottom: calc(6vh + 17vmin); }
    .tb-place::after { content: ""; position: absolute; left: 6%; top: 6%; width: 32%; height: 32%; background: var(--block, none) center / contain; image-rendering: pixelated; }
    .tb-throw { right: calc(5vw + 8vmin + env(safe-area-inset-right)); bottom: calc(8vh + 25vmin); }
    .tb-bomb { right: calc(5vw + 42vmin + env(safe-area-inset-right)); bottom: 6vh; }
    .tb.sys { width: 11vmin; height: 11vmin; top: calc(10px + env(safe-area-inset-top)); }
    .tb-pause { right: calc(12px + 130px + 8px + env(safe-area-inset-right)); }
    .tb-inventory { right: calc(12px + 130px + 16px + 11vmin + env(safe-area-inset-right)); }
    #death .go { font: inherit; font-weight: bold; color: var(--ui-gold); background: var(--ui-line); border: 0; padding: 8px 18px; margin-top: 12px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ui-bevel-hi); }
    #inventory header .close { margin-left: 10px; font: inherit; font-size: 20px; color: var(--ui-text); background: var(--ui-line); border: 0; width: 36px; height: 36px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ui-bevel-hi); }
    #rotate { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 20px; background: var(--pal-ink-void); color: var(--ui-text); }
    @media (orientation: portrait) { body.dev-touch #rotate { display: flex; } }
    body.dev-touch #items { display: none; }
    body.dev-touch #minimap { width: 130px; }
    body.dev-touch #status { top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); }
    body.dev-touch #corner { top: calc(8px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); }
    body.dev-touch #depth { font-size: 14px; }
    body.dev-touch #hand { bottom: 8px; gap: 4px; pointer-events: none; }
    body.dev-touch .slot { width: calc(16 * var(--u)); height: calc(16 * var(--u)); padding: 2px; }
    body.dev-touch #banner { top: 4%; max-width: min(560px, 60vw); }
    body.dev-touch #banner .ribbon { padding: calc(4 * var(--u)); }
    body.dev-touch #banner .ribbon img { width: 52px; height: 52px; }
    body.dev-touch #banner b { font-size: 20px; }
    body.dev-touch #toast { top: 18%; }
    body.dev-touch #overlay { padding: calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
    body.dev-touch #overlay .card { width: min(920px, 100%); }
    body.dev-touch #overlay .cover img { max-height: 34vh; }
    body.dev-touch #overlay .tagline { margin: 6px 12px 8px; font-size: 14px; }
    body.dev-touch #overlay .menu { grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 10px 20px; }
    body.dev-touch #overlay .actions button { padding: 10px 14px; }
    body.dev-touch #overlay table { font-size: 14px; }
    body.dev-touch #controls tbody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
    body.dev-touch #controls tr { display: flex; flex-direction: column; padding: 3px 0; }
    body.dev-touch #controls td { padding: 0; }
    body.dev-touch #inventory .card { width: 96vw; max-height: 94vh; padding: calc(4 * var(--u)) calc(5 * var(--u)); }
    body.dev-touch #inventory .cols { grid-template-columns: 1fr 220px; }
    body.dev-touch #inventory header .close { width: 44px; height: 44px; }
    @media (max-width: 700px) { #inventory .cols { grid-template-columns: 1fr; } #banner .ribbon img { width: 52px; height: 52px; } #banner b { font-size: 20px; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="status">
    <div id="hearts"></div>
    <div id="breath"></div>
    <div class="counter"><span class="ico bomb"></span><span id="bombs">01</span></div>
    <div class="counter"><span class="ico key"></span><span id="keys">00</span></div>
    <div id="polarity" data-polarity="positive"></div>
    <div id="items"></div>
  </div>
  <div id="hand"></div>
  <div id="corner"><canvas id="minimap" class="slate"></canvas><div id="depth"></div></div>
  <div id="debug"></div>
  <div id="banner"></div>
  <div id="toast" class="slate"></div>
  <div id="inventory"></div>
  <div id="death"></div>
  <div id="fade"><i></i></div>
  <div id="overlay">
    <div class="card slate">
      <h1 class="cover"><img src="/the-roots-cover.jpg" alt="THE ROOTS" width="1663" height="640" /></h1>
      <p class="tagline" data-i18n="intro.tagline">Go down into yourself. Break what holds you. Find the way back up.</p>
      <div class="menu">
        <div class="actions">
          <button type="button" class="go" id="play" data-act="resume" data-i18n="intro.play">Click to play</button>
          <button type="button" id="newrun" data-act="restart" data-i18n="pause.newRun">New run</button>
          <div id="lang"></div>
          <p id="seed" class="seed"></p>
        </div>
        <section>
          <h2 data-i18n="intro.controls">Controls</h2>
          <table id="controls"></table>
        </section>
      </div>
      <footer class="credits">
        <p><span data-i18n="intro.openSource">This game is open source and open to collaboration: if you love video games and want to help, you are welcome here.</span> <a href="https://github.com/yeagob/sotano" target="_blank" rel="noopener" data-i18n="intro.repo">Repository</a></p>
        <span id="version"></span>
        <a class="coffee" href="https://buymeacoffee.com/yeagob" target="_blank" rel="noopener" title="Buy me a coffee" aria-label="Buy me a coffee"></a>
      </footer>
    </div>
  </div>
  <div id="rotate" data-i18n="touch.rotate">Turn your device sideways to play</div>
  <div id="loading" data-i18n="app.loading">Loading…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
