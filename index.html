  <style>
    /* Pixelify Sans (SIL OFL 1.1, public/fonts/PIXELIFY-SANS-OFL.txt): the approved display face, sizes 20 / 28 / 40 px only
       (docs/art/DECISIONS.md §10.2). Latin subset, self-hosted. */
    @font-face { font-family: "Pixelify Sans"; src: url("fonts/pixelify-sans-latin-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    /* Vessel Light UI (docs/art/DECISIONS.md §10.2). Every colour is a palette token written by
       applyPaletteCss() (src/render/icons.ts) as a CSS variable: no hex in this file. */
    :root { --u: clamp(2px, calc(100vh / 384), 5px);
      /* a 1 u pixel chamfer for tiles, buttons and blocks inside a slate (the slate itself cuts 2 u) */
      --cut: polygon(var(--u) 0, calc(100% - var(--u)) 0, 100% var(--u), 100% calc(100% - var(--u)), calc(100% - var(--u)) 100%, var(--u) 100%, 0 calc(100% - var(--u)), 0 var(--u)); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--pal-ink-void); overflow: hidden; color: var(--ui-text);
      font: 15px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; user-select: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    img { image-rendering: pixelated; }
    /* the cellar slate: ink panel, ink outline, inner bevel, chamfered corners, no radius, no blur */
    .slate { background: color-mix(in srgb, var(--ui-panel) 95%, transparent); outline: 1px solid var(--ui-line);
      box-shadow: inset 2px 2px 0 var(--ui-bevel-hi), inset -2px -2px 0 var(--ui-line);
      clip-path: polygon(calc(2 * var(--u)) 0, calc(100% - 2 * var(--u)) 0, 100% calc(2 * var(--u)), 100% calc(100% - 2 * var(--u)),
        calc(100% - 2 * var(--u)) 100%, calc(2 * var(--u)) 100%, 0 calc(100% - 2 * var(--u)), 0 calc(2 * var(--u))); }

    /* crosshair: shape, not colour */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--ui-text); box-shadow: 0 0 0 1px var(--ui-line); }
    #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
    #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }

    /* Isaac corner: hearts, bombs, keys, practices */
    #status { position: fixed; top: 10px; left: 12px; pointer-events: none; }
    .hearts-row { display: flex; align-items: center; gap: calc(5 * var(--u)); margin-bottom: 6px; }
    .hearts-box { position: relative; display: flex; }
    #hearts, .hearts-strip { display: flex; gap: var(--u); }
    /* spirit (sky only): a 1 u light.core outline round the hearts on a 1 u ink.void keyline, drawn clockwise from the
       top left in proportion to spirit / 100, sliding over 0.3 s; its number at the row's end. Art: DECISIONS §10.7. */
    .spirit-ring { position: absolute; left: calc(-3 * var(--u)); top: calc(-3 * var(--u)); width: calc(100% + 6 * var(--u));
      height: calc(100% + 6 * var(--u)); overflow: visible; display: none; pointer-events: none; }
    .spirit-ring rect { fill: none; transition: stroke-dasharray .3s linear; }
    .spirit-key { stroke: var(--pal-ink-void); stroke-width: calc(3 * var(--u)); }
    .spirit-line { stroke: var(--pal-light-core); stroke-width: var(--u); }
    .spirit-num { display: none; margin-left: calc(3 * var(--u)); font-family: "Pixelify Sans", system-ui, sans-serif; font-size: 20px; color: var(--ui-text);
      font-variant-numeric: tabular-nums; text-shadow: 1px 0 var(--ui-line), -1px 0 var(--ui-line), 0 1px var(--ui-line), 0 -1px var(--ui-line); }
    /* the sky's row pads 5 u so the outline (4.5 u reach from the hearts) stays inside the screen's top and left edges at any scale */
    .hearts-row.sky { padding: calc(5 * var(--u)); }
    .hearts-row.sky .spirit-ring { display: block; }
    .hearts-row.sky .spirit-num { display: block; }
    .heart { position: relative; width: calc(11 * var(--u)); height: calc(10 * var(--u)); display: inline-block;
      background: no-repeat center/contain var(--ico-heartEmpty); image-rendering: pixelated; }
    .heart.full { background-image: var(--ico-heart); }
    .heart > .heart { position: absolute; left: 0; top: 0; }
    /* invulnerable: steady at 55 % with a paper outline (the 5.5 Hz blink is gone) */
    #hearts.safe > .heart { opacity: .55; outline: 1px solid var(--ui-text); }
    /* low health: the last heart beats at 1.1 Hz */
    #hearts.low > .heart:last-child { animation: beat .9s ease-in-out infinite; }
    .heart.layer { background-image: none; }
    .heart.full.k-blue { background-image: var(--ico-heartBlue); }
    .heart.full.k-black { background-image: var(--ico-heartBlack); }
    .heart.full.k-stone { background-image: var(--ico-heartStone); }
    .heart.full.k-berserker { background-image: var(--ico-heartBerserker); }
    #hearts.star > .heart { outline: 1px solid var(--star-glow); filter: drop-shadow(0 0 3px var(--star-glow)); }
    #hearts.blood > .heart:not(.layer) { animation: beat 1.6s ease-in-out infinite; }
    body.berserk #hearts > .heart.layer:has(.k-berserker) { filter: drop-shadow(0 0 4px var(--berserk-glow)); }
    @keyframes beat { 50% { transform: scale(1.12); } }
    /* breath under water: bubbles that pop one by one; the last one pulses when it is almost gone */
    #breath { display: none; gap: calc(var(--u) / 2); margin-bottom: 6px; }
    #breath.on { display: flex; }
    .bubble { width: calc(8 * var(--u)); height: calc(8 * var(--u)); background: no-repeat center/contain var(--ico-bubble); image-rendering: pixelated; }
    .bubble.empty { background-image: var(--ico-bubbleEmpty); opacity: .6; }
    #breath.low > .bubble.last { animation: beat .7s ease-in-out infinite; }
    .counter { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: bold; margin: 2px 0;
      font-variant-numeric: tabular-nums; text-shadow: 1px 0 var(--ui-line), -1px 0 var(--ui-line), 0 1px var(--ui-line), 0 -1px var(--ui-line); }
    .counter .ico { width: 24px; height: 24px; background: no-repeat center/contain; image-rendering: pixelated; }
    .ico.bomb { background-image: var(--ico-seed); }
    /* a positive intention's bombs are white, as the bomb placed then is (DECISIONS §14.1); the count takes the same colour */
    #status[data-polarity="positive"] .ico.bomb { background-image: var(--ico-seedLove); }
    #status[data-polarity="positive"] #bombs { color: var(--pal-light-hot); }
    #status[data-polarity="negative"] #bombs { color: var(--pal-light-ember); }
    .ico.key { background-image: var(--ico-key); }
    /* the loaded intention (F): a square pixel frame in its polarity colour (gold, or ember) round a 10 × 10 miniature of the
       intention itself at 2×: a gold bead with a white core for the good one, an ash bead with an ember core for the bad one.
       The value of the bead says it (light against charred); the frame's hue only confirms it. Static, never animated. The 1 px ink outline keeps it
       readable over any floor or the sky, like the counters' text outline. */
    #polarity { box-sizing: content-box; width: 20px; height: 20px; margin: 4px 0 2px 3px; padding: 2px; border: 2px solid var(--pol);
      background: var(--ico-intentPositive) no-repeat center / 20px var(--ui-panel); image-rendering: pixelated; box-shadow: 0 0 0 1px var(--ui-line); }
    #polarity[data-polarity="negative"] { background-image: var(--ico-intentNegative); }
    /* Kairos (#123): three pips for the charge, a dimmed page while time is stopped, numbered marks on the world */
    #kairos { display: flex; align-items: center; gap: 4px; margin: 4px 0 2px 3px; }
    #kairos[hidden] { display: none; }
    #kairos i { width: 8px; height: 8px; border: 2px solid var(--ui-line); transform: rotate(45deg); display: inline-block; }
    #kairos i.on { background: var(--kairos); border-color: var(--kairos); }
    #kairos em { font-style: normal; font-size: 12px; margin-left: 4px; }
    #kairos-marks { position: fixed; inset: 0; pointer-events: none; }
    #kairos-marks b { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid var(--kairos);
      border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--kairos); background: rgba(0, 0, 0, 0.35); }
    #kairos-marks b[hidden] { display: none; }
    body.kairos-stop #game { filter: saturate(0.25) brightness(0.9); }
    .tb-miracle { background: conic-gradient(var(--kairos) calc(var(--charge, 0) * 360deg), transparent 0); }
    #items { display: flex; flex-wrap: wrap; gap: 3px; max-width: 220px; margin-top: 8px; }
    /* Status timer (sotano-popups: persistent status): the practice icon and the seconds left, a slate pill; in the last
       second the outline turns to the ember token. The tint is a soft wash over the screen that lets the walls read thin. */
    #phase { display: flex; align-items: center; gap: 4px; margin-top: 6px; padding: 2px 6px; width: max-content;
      font-variant-numeric: tabular-nums; color: var(--ui-text); text-shadow: 1px 0 var(--ui-line), -1px 0 var(--ui-line), 0 1px var(--ui-line), 0 -1px var(--ui-line); }
    #phase[hidden] { display: none; }
    #phase img { width: 24px; height: 24px; image-rendering: pixelated; }
    #phase.warn { outline: 2px solid var(--ui-warn, var(--ui-text)); }
    #phase-tint { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 40%, color-mix(in srgb, var(--phase-tint, #888) 30%, transparent) 100%); }
    #phase-tint.on { opacity: 1; }
    #items img { width: 28px; height: 28px; }

    /* hand slots */
    #hand { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; }
    /* the held-item label: the flask or meal in hand, named above the hand (sotano-popups: persistent status) */
    #held { position: fixed; left: 50%; bottom: calc(18px + 24 * var(--u) + 10px); transform: translateX(-50%); pointer-events: none;
      display: none; flex-direction: column; align-items: center; gap: 2px; max-width: min(92vw, 420px); padding: 4px 10px; text-align: center;
      color: var(--ui-text); font-size: calc(11 * var(--u)); }
    #held.show { display: flex; }
    #held b { font-weight: 600; }
    #held span { opacity: 0.85; }
    body.dev-touch #held { bottom: calc(8px + 16 * var(--u) + 10px); }
    .slot { position: relative; width: calc(24 * var(--u)); height: calc(24 * var(--u)); padding: 4px; }
    .slot.on { box-shadow: inset 0 0 0 2px var(--ui-gold); }
    .slot.extra { opacity: 0.55; }
    .slot img { width: 100%; height: 100%; display: block; }
    #inventory .hand-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    #inventory .hand-row .slot { cursor: pointer; }
    #inventory .hand-row .slot.sel { outline: 2px solid var(--ui-text); outline-offset: 2px; }

    /* minimap top-right (the right hand used to cover it), floor label underneath */
    #corner { position: fixed; right: 12px; top: 10px; text-align: right; pointer-events: none; }
    #minimap { display: block; margin: 0 0 4px auto; width: 180px; padding: 4px; }
    #depth { font-size: 15px; color: var(--ui-text-2); }
    #debug { position: fixed; right: 10px; bottom: 8px; text-align: right; white-space: pre; font: 12px/1.3 ui-monospace, Consolas, monospace; opacity: .8; pointer-events: none; display: none; }

    /* practice banner: slate, top 12 %, click to dismiss */
    #banner { position: fixed; left: 50%; top: 12%; transform: translate(-50%, -14px); pointer-events: none; opacity: 0; max-width: min(640px, 92vw); }
    #banner.show { animation: bannerIn .5s ease forwards; }
    @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -14px) scale(.96); } 60% { opacity: 1; transform: translate(-50%, 0) scale(1.03); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { #banner.show { animation: none; opacity: 1; transform: translate(-50%, 0); } }
    #banner .dismiss { margin: 8px 0 0; font-size: 14px; color: var(--ui-faded); text-align: right; }
    /* the practice card (#375): it takes the pointer, its text scrolls (touch pans it, the wheel and the keys scroll it),
       and a drag never reaches the game or closes it */
    #banner[data-practice="true"] { pointer-events: auto; }
    #banner[data-practice="true"] .ribbon { max-height: 72vh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
    /* the kicker of an achievement card: a short line above the name, with a gold diamond (ACHIEVEMENTS §4) */
    #banner .kicker { display: block; font-style: normal; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold, var(--c)); }
    #banner .kicker::before { content: '\25C6  '; }
    #banner .ribbon { display: flex; gap: 14px; align-items: flex-start; padding: calc(6 * var(--u)); border-left: calc(2 * var(--u)) solid var(--c); }
    #banner .ribbon img { width: 70px; height: 70px; flex: none; filter: drop-shadow(0 0 8px var(--c)); }
    #banner b { display: block; font-size: 28px; letter-spacing: 1px; }
    #banner span { display: block; margin-top: 2px; font-size: 16px; font-style: italic; color: var(--ui-text-2); }
    #banner small { display: block; margin-top: 3px; font-size: 14px; color: var(--ui-faded); }
    .effect { margin: 6px 0 2px; padding: 4px 8px; background: var(--ui-line); border-left: 3px solid var(--c, var(--ui-text-2)); font-size: 15px; color: var(--ui-text); }
    #banner i { display: block; font-style: normal; font-size: 15px; margin-top: 3px; }
    #banner i.up { color: var(--ui-up); } #banner i.down { color: var(--ui-down); } #banner i.syn { color: var(--ui-gold); }
    .q { font-style: normal; letter-spacing: 1px; font-size: 15px; color: var(--ui-gold); }
    .q4 { text-shadow: 0 0 6px var(--ui-gold); }
    #banner[data-offer="true"] { width: min(440px, calc(100vw - 24px)); max-width: min(440px, calc(100vw - 24px)); pointer-events: auto; }
    #banner .offer-question, #banner .offer-request, #banner .offer-controls { visibility: hidden; }
    #banner[data-offer="true"] .offer-question, #banner[data-offer="true"] .offer-request, #banner[data-offer="true"] .offer-controls { visibility: visible; }
    #banner .offer-request { display: block; margin: 8px 0 0; font-style: normal; font-size: 15px; line-height: 1.4; color: var(--ui-text-2); }
    #banner .offer-request small { font-size: 14px; color: var(--ui-faded); }
    #banner .offer-question { margin: 0; font-size: 16px; line-height: 1.4; color: var(--ui-text); }
    #banner .offer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; visibility: hidden; pointer-events: none; }
    #banner[data-offer="true"] .offer-actions { visibility: visible; pointer-events: auto; }
    #banner .offer-actions button { flex: 1 1 0; min-width: 44px; min-height: 48px; padding: 8px 12px; font: inherit; font-weight: bold;
      color: var(--ui-text); background: var(--ui-line); border: 0; cursor: pointer; pointer-events: none; touch-action: manipulation;
      box-shadow: inset 0 0 0 1px var(--ui-bevel-hi); }
    #banner[data-offer="true"] .offer-actions button { pointer-events: auto; }
    #banner .offer-actions .offer-accept { color: var(--ui-gold); box-shadow: inset 0 0 0 2px var(--ui-gold); }
    #banner .offer-actions.choices button.on { color: var(--ui-gold); box-shadow: inset 0 0 0 2px var(--ui-gold); }
    #banner .offer-actions button:hover { color: var(--ui-gold); box-shadow: inset 0 0 0 2px var(--ui-gold); }
    #banner .offer-actions button:focus-visible { outline: 2px solid var(--ui-text); outline-offset: 2px; }
    #banner .offer-controls { display: block; margin-top: 8px; font-size: 14px; line-height: 1.4; color: var(--ui-faded); }
    /* the achievement notice (sotano-popups §2, "Achievement notice"): its own element, a slate strip in the top-right
       corner with a gold medal and a gold accent bar. It slides in on pixel steps, never blinks, and never blurs. */
    #achievement { position: fixed; right: calc(6 * var(--u)); top: 26%; width: min(360px, calc(100vw - 24px)); pointer-events: none;
      opacity: 0; transform: translateX(calc(100% + 12 * var(--u))); transition: transform .36s steps(6, end), opacity .2s; }
    #achievement.show { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { #achievement { transition: none; } }
    #achievement .ach { display: flex; align-items: center; gap: calc(4 * var(--u)); padding: calc(4 * var(--u)) calc(6 * var(--u)) calc(4 * var(--u)) calc(5 * var(--u));
      border-left: calc(2 * var(--u)) solid var(--ui-gold); }
    #achievement .ach-medal { flex: none; width: calc(10 * var(--u)); height: calc(10 * var(--u)); background: no-repeat center/contain var(--ico-achievement); image-rendering: pixelated; }
    #achievement .ach-text { min-width: 0; }
    #achievement .ach-kicker { display: block; font: 20px/1 "Pixelify Sans", system-ui, sans-serif; font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--ui-gold); }
    #achievement .ach-kicker::before { content: '\25C6  '; }
    #achievement .ach-name { display: block; margin-top: 4px; font: 28px/1.1 "Pixelify Sans", system-ui, sans-serif; color: var(--ui-text); }
    #achievement .ach-desc { display: block; margin-top: 4px; font-size: 16px; line-height: 1.4; color: var(--ui-text-2); }
    #achievement .ach-mastery { display: block; margin-top: 4px; font-size: 14px; color: var(--ui-faded); }

    /* screen effects, gentle (§10.4): item flash peak .45 over .5 s; hurt vignette life.dark peak .35 over .4 s */
    #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 45%, var(--c) 0%, transparent 70%); }
    #flash.on { animation: flash .5s ease-out; }
    @keyframes flash { 0% { opacity: .45; } 100% { opacity: 0; } }
    #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 160px 40px var(--pal-life-dark); }
    #hurt.on { animation: hurt .4s ease-out; }

    /* the Recipe Book (Book of Secrets, DECISIONS §14.5): the star map's card finish; chapters of chamfered pages with

    body.dev-touch #banner b { font-size: 20px; }
    body.dev-touch #toast { top: 18%; }
    body.dev-touch #overlay { padding: calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
    body.dev-touch #overlay .card { width: min(920px, 100%); }
    body.dev-touch #overlay .cover img { max-height: 34vh; }
    body.dev-touch #overlay .tagline { margin: 6px 12px 8px; font-size: 14px; }
    body.dev-touch #overlay .menu { grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 10px 20px; }
    body.dev-touch #overlay .actions button { padding: 10px 14px; }
    body.dev-touch #overlay #graphics button { width: 40px; height: 40px; padding: 0; }
    body.dev-touch #graphics input { height: 40px; }
    body.dev-touch #graphics input::-webkit-slider-thumb { width: 18px; height: 28px; margin-top: -11px; }
    body.dev-touch #graphics input::-moz-range-thumb { width: 18px; height: 28px; }
    body.dev-touch #overlay table { font-size: 14px; }
    body.dev-touch #controls tbody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
    body.dev-touch #controls tr { display: flex; flex-direction: column; padding: 3px 0; }
    body.dev-touch #controls td { padding: 0; }
    body.dev-touch #inventory .card { width: 96vw; max-height: 94vh; padding: calc(4 * var(--u)) calc(5 * var(--u)); }
    body.dev-touch #inventory .cols { grid-template-columns: 1fr 220px; }
    body.dev-touch #inventory header .close { width: 44px; height: 44px; }
    @media (max-width: 480px) {
      #banner[data-offer="true"] { width: calc(100vw - 24px); max-width: calc(100vw - 24px); }
      #banner .offer-actions { flex-direction: column; }
      #banner .offer-actions button { width: 100%; }
    }
    @media (hover: none) and (pointer: coarse) {
      #banner[data-offer="true"] { width: min(440px, calc(100vw - 24px)); max-width: calc(100vw - 24px); }
      body.dev-touch #banner[data-offer="true"] { max-width: calc(100vw - 24px); }
      #banner .offer-actions { flex-direction: column; }
      #banner .offer-actions button { width: 100%; }
    }
    @media (max-width: 700px) { #inventory .cols { grid-template-columns: 1fr; } #banner .ribbon img { width: 52px; height: 52px; } #banner b { font-size: 20px; } }
    /* ── the pause card's pixel pass (issue #223): the achievement notice's finish, kept in this one block. Pixelify Sans
       only at 20 px here (tabs, buttons, headings, the field of view); chamfered (--cut) and bevelled controls; a 2 u
       gold accent bar on the card's left like the notice's; palette tokens only (DECISIONS §10.2). ── */
    #overlay > .card { border-left: calc(2 * var(--u)) solid var(--ui-gold); }
    #overlay .tabs button { font: 20px/1 "Pixelify Sans", system-ui, sans-serif; letter-spacing: .08em; padding: 8px 16px 9px;
      box-shadow: inset 2px 2px 0 var(--ui-bevel-hi); clip-path: var(--cut); }
    #overlay .tabs button[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--ui-gold), inset 4px 4px 0 var(--ui-bevel-hi); }
    #overlay .tabs button:hover, #overlay .tabs button:focus-visible { box-shadow: inset 0 0 0 2px var(--ui-gold), inset 0 0 0 3px var(--ui-text); }
    #overlay .cover { border-bottom: var(--u) solid var(--ui-line); }
    #overlay .actions button { font: 20px/1.1 "Pixelify Sans", system-ui, sans-serif; padding: 10px 14px; box-shadow: inset 2px 2px 0 var(--ui-bevel-hi); clip-path: var(--cut); }
    #overlay #play { box-shadow: inset 0 0 0 2px var(--ui-gold), inset 4px 4px 0 var(--ui-bevel-hi); }
    #overlay .actions button:hover, #overlay .actions button:focus-visible { box-shadow: inset 0 0 0 2px var(--ui-gold), inset 0 0 0 3px var(--ui-text); }
    #overlay h2 { font: 20px/1 "Pixelify Sans", system-ui, sans-serif; letter-spacing: .08em; color: var(--ui-gold); margin: 0 0 8px; }
    #overlay .panel-menu h2::before { content: '\25C6  '; }
    #overlay #lang button { font: 20px/1 "Pixelify Sans", system-ui, sans-serif; padding: 5px 8px 6px; box-shadow: inset 2px 2px 0 var(--ui-bevel-hi); clip-path: var(--cut); }
    #overlay #lang button:hover, #overlay #lang button:focus-visible, #overlay #lang button.on { color: var(--ui-gold); box-shadow: inset 0 0 0 2px var(--ui-gold); }
    #graphics output { font: 20px/1 "Pixelify Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    #overlay #graphics button { font: 20px/1 "Pixelify Sans", system-ui, sans-serif; }
    #overlay #controls td:first-child { color: var(--ui-gold); }
    #overlay #controls tr + tr td { border-top: 1px solid var(--ui-line); }
    #overlay .credits .coffee, #overlay .credits .bug { box-shadow: inset 2px 2px 0 var(--ui-bevel-hi); clip-path: var(--cut); }
    #overlay .seed { font-variant-numeric: tabular-nums; }
    /* a phone held sideways: the two-column controls wrap their key names instead of running off the card */
    body.dev-touch #controls tbody { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    body.dev-touch #overlay #controls td:first-child { white-space: normal; }
    body.dev-touch #overlay .actions button { padding: 12px 14px; }
  </style>
</head>
<body>
  <!-- Crawlers that do not run scripts read this. Players with scripts off see it too. The game itself is a canvas. -->
  <noscript>
    <main>
      <h1>THE ROOTS</h1>
      <p>A first-person voxel roguelite about going deeper, free to play in your browser with no install. Break the blocks that hold you, shoot intentions with a polarity, meet the projections of your patterns in the depths, and collect practices that change how you play, every run.</p>
      <p>Think of it as Minecraft and The Binding of Isaac had a child, with a cavern world as deep and dark as Noita. Open source: <a href="https://github.com/yeagob/sotano">github.com/yeagob/sotano</a>. Enable JavaScript to play.</p>
    </main>
  </noscript>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="hurt-side"></div>
  <div id="star"></div>
  <div id="berserk"></div>
  <div id="status" data-polarity="positive">
    <div id="hearts-row" class="hearts-row">
      <div id="hearts-box" class="hearts-box"><div id="hearts"></div></div>
      <div id="spirit-num" class="spirit-num" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div>
    </div>
    <div id="breath"></div>
    <div class="counter"><span class="ico bomb"></span><span id="bombs">01</span></div>
    <div class="counter"><span class="ico key"></span><span id="keys">00</span></div>
    <div id="polarity" data-polarity="positive"></div>
    <div id="kairos" hidden><span><i></i><i></i><i></i></span><em></em></div>
    <div id="kairos-marks"></div>
    <div id="phase" class="slate" hidden role="status"></div>
    <div id="items"></div>
    <div id="phase-tint" aria-hidden="true"></div>
  </div>
  <div id="hand"></div>
  <div id="held" aria-live="polite"></div>
  <div id="corner"><canvas id="minimap" class="slate"></canvas><div id="depth"></div></div>
  <div id="debug"></div>
  <div id="banner"></div>
  <div id="achievement" aria-live="polite"></div>
  <div id="toast" class="slate"></div>
  <div id="boss" hidden><span id="bossname"></span><div><i id="bossfill"></i><b id="bosslove"></b><u></u></div></div>
  <div id="toll"></div>
  <div id="death"></div>
  <div id="fade"><i></i></div>
  <div id="overlay">
    <div class="card slate">
      <nav class="tabs">
        <button type="button" data-act="tab-menu" data-tab="menu" aria-selected="true"></button>
        <button type="button" data-act="tab-items" data-tab="items" aria-selected="false"></button>
        <button type="button" data-act="tab-map" data-tab="map" aria-selected="false"></button>
        <button type="button" data-act="tab-recipes" data-tab="recipes" aria-selected="false" hidden></button>
      </nav>
      <div class="panel-menu">
      <h1 class="cover"><img src="/the-roots-cover.jpg" alt="THE ROOTS" width="1663" height="640" /></h1>
      <p class="tagline" data-i18n="intro.tagline">Go down into yourself. Break what holds you. Find the way back up.</p>
      <div class="menu">
        <div class="actions">
          <button type="button" class="go" id="play" data-act="resume" data-i18n="intro.play">Click to play</button>
          <button type="button" id="newrun" data-act="restart" data-i18n="pause.newRun">New run</button>
          <div id="lang"></div>
          <section id="graphics">
            <h2 data-i18n="graphics.title">Graphics</h2>
            <div class="row"><label for="fov" data-i18n="graphics.fov">Field of view</label><output id="fov-value" for="fov">75°</output></div>
            <div class="row">
              <button type="button" data-act="fov-down" aria-label="Narrower field of view">−</button>
              <input type="range" id="fov" min="70" max="100" step="5" value="75" />
              <button type="button" data-act="fov-up" aria-label="Wider field of view">+</button>
            </div>
            <p id="fov-hint" class="hint"></p>
          </section>
          <div id="completion"></div>
          <p id="seed" class="seed"></p>
        </div>
        <section>
          <h2 data-i18n="intro.controls">Controls</h2>
          <table id="controls"></table>
        </section>
      </div>
      <section id="codex">
        <h2 data-i18n="codex.title">Presences met</h2>
        <ul class="codex"></ul>
      </section>
      <footer class="credits">
        <p><span data-i18n="intro.openSource">This game is open source and open to collaboration: if you love video games and want to help, you are welcome here.</span> <a href="https://github.com/yeagob/sotano" target="_blank" rel="noopener" data-i18n="intro.repo">Repository</a></p>
        <span id="version"></span>
        <a class="bug" href="https://github.com/yeagob/sotano/issues/new?template=bug_report.md" target="_blank" rel="noopener" title="Report a bug" aria-label="Report a bug"></a>
        <a class="coffee" href="https://buymeacoffee.com/yeagob" target="_blank" rel="noopener" title="Buy me a coffee" aria-label="Buy me a coffee"></a>
      </footer>
      </div>
      <div id="inventory"></div>
      <div id="starmap"></div>
      <div id="recipebook"></div>
    </div>
  </div>
  <div id="rotate" data-i18n="touch.rotate">Turn your device sideways to play</div>
  <div id="loading" data-i18n="app.loading">Loading…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
